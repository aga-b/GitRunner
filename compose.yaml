name: personal-ci
services:
  controller:
    build:
      context: .
      dockerfile: controller/Dockerfile
    image: personal-ci-controller:local
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      STATE_DIR: /state
      GITHUB_APP_KEY_FILE: /run/secrets/github-app.pem
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./secrets:/run/secrets:ro
      - ./state:/state
    depends_on:
      - mirror
    mem_limit: 512m
    cpus: 1
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp:size=32m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      test: [CMD, python, -c, "import time,pathlib; p=pathlib.Path('/state/heartbeat'); assert p.exists() and time.time()-p.stat().st_mtime < 180"]
      interval: 30s
      timeout: 5s
      start_period: 180s
      retries: 5
  # Pull-through Docker Hub cache shared by every per-job Docker daemon.
  mirror:
    image: registry:2
    container_name: personal-ci-mirror
    restart: unless-stopped
    environment:
      REGISTRY_PROXY_REMOTEURL: https://registry-1.docker.io
      REGISTRY_PROXY_TTL: 168h
      REGISTRY_STORAGE_DELETE_ENABLED: 'true'
    volumes:
      - mirror-data:/var/lib/registry
    networks:
      - mirror
    mem_limit: 512m
    cpus: 1
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '2'
networks:
  mirror:
    name: personal-ci-mirror
volumes:
  mirror-data:
    name: personal-ci-mirror-data
