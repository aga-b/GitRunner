name: Self-hosted runner smoke
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    if: github.actor == github.repository_owner
    runs-on: [self-hosted, linux, x64, ci-linux]
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -h 127.0.0.1 -U postgres'
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - name: Validate isolated runtime
        run: |
          echo "Runner: $RUNNER_NAME / shard: ${{ matrix.shard }}"
          command -v apt-get
          sudo -n true
          psql --version
          docker info
          docker compose version
          python3 -c "import socket; s=socket.create_connection(('127.0.0.1',5432),timeout=10); s.close()"
          PGPASSWORD=ci-test-only psql -h 127.0.0.1 -U postgres -c "SELECT 1"
          sleep 30
